name: quality

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: coursehub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar código
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test
        
      - name: Ejecutar pruebas e2e
        run: npm run test:e2e
        env:
          NODE_ENV: test
          PORT: '3001'
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: coursehub_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: coursehub-actions-test-secret-at-least-32-characters
          JWT_EXPIRES_IN: 15m

      - name: Compilar
        run: npm run build